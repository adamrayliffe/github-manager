<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Backend Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <style>
        .monaco-editor { padding-top: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg"><i class="fa-solid fa-globe"></i></div>
            <h1 class="font-bold text-lg">Github Repo Manager</h1>
        </div>
        <div id="auth-controls" class="flex gap-2">
            <input type="password" id="github-token" placeholder="PAT Token..." class="bg-slate-950 border border-slate-700 px-3 py-1 rounded text-sm w-48">
            <button onclick="connectGitHub()" class="bg-blue-600 px-4 py-1 rounded text-sm hover:bg-blue-500 font-semibold">Connect</button>
        </div>
        <div id="user-controls" class="hidden flex items-center gap-4">
            <span id="user-login" class="text-sm text-slate-400"></span>
            <button onclick="disconnect()" class="text-xs text-red-400 hover:text-red-300">Disconnect</button>
        </div>
    </header>

    <main class="flex-grow p-6">
        <div id="repo-view" class="max-w-7xl mx-auto space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <input type="text" id="search-input" oninput="filterRepos()" placeholder="Search repositories..." class="bg-slate-900 border border-slate-700 px-4 py-2 rounded-lg w-full md:w-96 text-sm">
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="openCreateModal()" class="flex-grow md:flex-grow-0 bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-bold text-white transition"><i class="fa-solid fa-plus mr-2"></i>New Repository</button>
                    <button onclick="fetchRepos()" class="bg-slate-800 px-4 py-2 rounded-lg text-sm hover:bg-slate-700 transition"><i class="fa-solid fa-rotate-right mr-2"></i>Refresh</button>
                </div>
            </div>
            <div id="repo-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="ide-view" class="hidden h-[calc(100vh-100px)] flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <button onclick="closeIDE()" class="text-blue-400 hover:text-blue-300"><i class="fa-solid fa-arrow-left mr-2"></i>Back to Dashboard</button>
                <div class="flex items-center gap-4">
                    <button onclick="promptNewFile()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-bold transition"><i class="fa-solid fa-file-circle-plus mr-1"></i> New File</button>
                    <div id="file-meta" class="text-xs text-slate-500 font-mono"></div>
                </div>
            </div>
            <div class="flex flex-grow border border-slate-800 rounded-xl overflow-hidden bg-slate-900">
                <div id="file-explorer" class="w-64 border-r border-slate-800 p-4 overflow-y-auto text-sm bg-slate-950"></div>
                <div class="flex-grow flex flex-col">
                    <div id="editor" class="flex-grow"></div>
                    <div class="p-4 border-t border-slate-800 flex items-center gap-3 bg-slate-900">
                        <input type="text" id="commit-msg" placeholder="Commit message..." class="flex-grow bg-slate-950 border border-slate-700 px-3 py-2 rounded text-sm">
                        <button id="save-btn" onclick="saveFile()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg text-sm font-bold text-white hidden">
                            <i class="fa-solid fa-save mr-2"></i> Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Create Repository Modal -->
    <div id="create-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-lg">Create a new repository</h3>
                <button onclick="closeCreateModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Repository name *</label>
                    <input type="text" id="new-repo-name" placeholder="e.g. my-awesome-project" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Description (optional)</label>
                    <textarea id="new-repo-desc" placeholder="A short description of your project" class="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded text-sm focus:outline-none focus:border-blue-500" rows="2"></textarea>
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="new-repo-private" class="w-4 h-4 accent-blue-600 rounded">
                    <label for="new-repo-private" class="text-sm text-slate-300">Initialize as private repository</label>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="new-repo-init" checked class="w-4 h-4 accent-blue-600 rounded">
                    <label for="new-repo-init" class="text-sm text-slate-300">Add a README file</label>
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                <button onclick="closeCreateModal()" class="px-4 py-2 rounded text-sm bg-slate-800 hover:bg-slate-700">Cancel</button>
                <button onclick="createRepository()" class="px-5 py-2 rounded text-sm bg-emerald-600 hover:bg-emerald-500 font-bold text-white">Create Repository</button>
            </div>
        </div>
    </div>

    <script>
        let token = sessionStorage.getItem('github_token') || "";
        let allRepos = [];
        let currentEditor = null;
        let currentFile = null;
        let activeRepoFullName = "";

        async function connectGitHub() {
            token = document.getElementById('github-token').value;
            sessionStorage.setItem('github_token', token);
            await fetchRepos();
        }

        async function fetchRepos() {
            if(!token) return;
            const res = await fetch('https://api.github.com/user/repos?sort=updated&per_page=100', { headers: { Authorization: `Bearer ${token}` }});
            if(res.ok) {
                allRepos = await res.json();
                renderRepos(allRepos);
                document.getElementById('auth-controls').classList.add('hidden');
                document.getElementById('user-controls').classList.remove('hidden');
            } else {
                alert('Failed to authenticate with GitHub. Check your PAT token.');
            }
        }

        function renderRepos(repos) {
            const container = document.getElementById('repo-grid');
            if(!repos.length) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">No repositories found.</div>`;
                return;
            }
            container.innerHTML = repos.map(r => `
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl hover:border-slate-700 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold truncate text-blue-400">${r.name}</h3>
                            <span class="text-[10px] px-2 py-0.5 rounded border ${r.private ? 'border-amber-500/30 text-amber-400 bg-amber-500/10' : 'border-slate-700 text-slate-400 bg-slate-800'}">${r.private ? 'Private' : 'Public'}</span>
                        </div>
                        <p class="text-xs text-slate-400 h-8 mb-4 line-clamp-2">${r.description || 'No description provided.'}</p>
                    </div>
                    <button onclick="openIDE('${r.full_name}')" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded text-sm font-bold transition">Edit Code</button>
                </div>
            `).join('');
        }

        function openCreateModal() {
            document.getElementById('create-modal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.add('hidden');
            document.getElementById('new-repo-name').value = '';
            document.getElementById('new-repo-desc').value = '';
        }

        async function createRepository() {
            const name = document.getElementById('new-repo-name').value.trim();
            const description = document.getElementById('new-repo-desc').value.trim();
            const isPrivate = document.getElementById('new-repo-private').checked;
            const autoInit = document.getElementById('new-repo-init').checked;

            if(!name) {
                alert('Repository name is required.');
                return;
            }

            const res = await fetch('https://api.github.com/user/repos', {
                method: 'POST',
                headers: { 
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    description: description,
                    private: isPrivate,
                    auto_init: autoInit
                })
            });

            if(res.ok) {
                const newRepoData = await res.json();
                closeCreateModal();
                
                allRepos.unshift(newRepoData);
                renderRepos(allRepos);

                alert('Repository created successfully! It is now available in your manager.');
            } else {
                const err = await res.json();
                alert('Failed to create repository: ' + (err.message || 'Unknown error'));
            }
        }

        async function openIDE(fullName) {
            activeRepoFullName = fullName;
            document.getElementById('repo-view').classList.add('hidden');
            document.getElementById('ide-view').classList.remove('hidden');
            await loadFileExplorer(fullName);
        }

        async function loadFileExplorer(fullName) {
            const res = await fetch(`https://api.github.com/repos/${fullName}/contents`, { headers: { Authorization: `Bearer ${token}` }});
            const files = await res.json();
            const explorer = document.getElementById('file-explorer');
            
            if(Array.isArray(files)) {
                explorer.innerHTML = files.filter(f => f.type === 'file').map(f => `
                    <div class="cursor-pointer hover:text-blue-400 py-1 truncate flex items-center justify-between group" onclick="loadFile('${fullName}', '${f.path}', '${f.url}')">
                        <span><i class="fa-solid fa-file-code mr-2 text-slate-500"></i>${f.name}</span>
                    </div>
                `).join('');
            } else {
                explorer.innerHTML = '<span class="text-xs text-slate-500">Empty repository</span>';
            }
        }

        function promptNewFile() {
            const fileName = prompt("Enter new file path/name (e.g., index.html or pages/about.html):");
            if(!fileName) return;

            currentFile = {
                fullName: activeRepoFullName,
                path: fileName.trim(),
                sha: null 
            };

            document.getElementById('file-meta').innerText = `${activeRepoFullName} / ${currentFile.path} (New File)`;

            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});
            require(['vs/editor/editor.main'], () => {
                if(currentEditor) currentEditor.dispose();
                currentEditor = monaco.editor.create(document.getElementById('editor'), { 
                    value: "<!-- Write your new HTML content here -->\n", 
                    language: currentFile.path.endsWith('.html') ? 'html' : 'javascript', 
                    theme: 'vs-dark' 
                });
                document.getElementById('save-btn').classList.remove('hidden');
            });
        }

        async function loadFile(fullName, path, url) {
            const res = await fetch(url, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3.raw' }});
            const content = await res.text();
            
            const metaRes = await fetch(`https://api.github.com/repos/${fullName}/contents/${path}`, { headers: { Authorization: `Bearer ${token}` }});
            const meta = await metaRes.json();
            
            currentFile = { fullName, path, sha: meta.sha };
            document.getElementById('file-meta').innerText = `${fullName} / ${path}`;
            
            require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});
            require(['vs/editor/editor.main'], () => {
                if(currentEditor) currentEditor.dispose();
                currentEditor = monaco.editor.create(document.getElementById('editor'), { value: content, language: path.endsWith('.html') ? 'html' : 'javascript', theme: 'vs-dark' });
                document.getElementById('save-btn').classList.remove('hidden');
            });
        }

        async function saveFile() {
            if(!currentFile || !currentEditor) return;
            
            const content = currentEditor.getValue();
            const message = document.getElementById('commit-msg').value || `Update ${currentFile.path}`;
            
            const utf8Bytes = new TextEncoder().encode(content);
            let binaryString = '';
            for (let i = 0; i < utf8Bytes.length; i++) {
                binaryString += String.fromCharCode(utf8Bytes[i]);
            }
            const base64Content = btoa(binaryString);

            const payload = { 
                message: message, 
                content: base64Content 
            };
            if(currentFile.sha) {
                payload.sha = currentFile.sha;
            }

            const res = await fetch(`https://api.github.com/repos/${currentFile.fullName}/contents/${currentFile.path}`, {
                method: 'PUT',
                headers: { 
                    Authorization: `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify(payload)
            });

            if(res.ok) {
                const data = await res.json();
                currentFile.sha = data.content.sha;
                document.getElementById('commit-msg').value = '';
                alert('Changes saved and committed to GitHub successfully!');
                await loadFileExplorer(currentFile.fullName);
            } else {
                const errData = await res.json();
                alert('Failed to save: ' + (errData.message || 'Check console for details.'));
                console.error(errData);
            }
        }

        function closeIDE() {
            document.getElementById('repo-view').classList.remove('hidden');
            document.getElementById('ide-view').classList.add('hidden');
            document.getElementById('save-btn').classList.add('hidden');
            currentFile = null;
        }

        function disconnect() {
            sessionStorage.removeItem('github_token');
            location.reload();
        }

        function filterRepos() {
            const q = document.getElementById('search-input').value.toLowerCase();
            renderRepos(allRepos.filter(r => r.name.toLowerCase().includes(q)));
        }
        
        if(token) fetchRepos();
    </script>
</body>
</html>
